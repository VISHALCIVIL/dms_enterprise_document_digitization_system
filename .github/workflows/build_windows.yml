name: Build Windows Application (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.5'

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Static Analysis
      run: flutter analyze --no-fatal-warnings --no-fatal-infos

    - name: Inject Service Account Credentials
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      run: |
        New-Item -ItemType Directory -Force -Path "assets/config"
        if ($env:SERVICE_ACCOUNT_JSON) {
          Set-Content -Path "assets/config/service_account.json" -Value $env:SERVICE_ACCOUNT_JSON
        } elseif (-not (Test-Path "assets/config/service_account.json")) {
          Set-Content -Path "assets/config/service_account.json" -Value "{}"
        }

    - name: Build Windows Release Executable
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        CMAKE_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      run: |
        $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
        $env:CMAKE_ARGS = "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        flutter build windows --release

    - name: Package Release ZIP
      run: |
        python -c "import shutil; shutil.make_archive('scandigitize_windows_release', 'zip', r'build\windows\x64\runner\Release')"

    - name: Upload Windows Executable & Bundle Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scandigitize-windows-build
        path: |
          scandigitize_windows_release.zip
          build/windows/x64/runner/Release/
