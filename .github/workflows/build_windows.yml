name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.5'

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Static Analysis
      run: flutter analyze --no-fatal-infos

    - name: Build Windows Release Executable
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        CMAKE_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      run: |
        $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
        $env:CMAKE_ARGS = "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        flutter build windows --release

    - name: Package Release ZIP
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath scandigitize_windows_release.zip

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: scandigitize-windows-exe
        path: scandigitize_windows_release.zip
